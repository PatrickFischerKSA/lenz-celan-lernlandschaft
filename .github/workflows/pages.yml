name: Publish learning landscape
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
env:
  PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check content.js && node --check app.js && node --check atlas.js && node --check journeys.js && node --test tests/*.test.mjs
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html styles.css app.js content.js atlas.js journeys.js .nojekyll _site/
          cp -R assets materialien _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          for attempt in $(seq 1 12); do
            artifact_id=$(gh api "$ARTIFACT_API" --jq ".artifacts[] | select(.name == \"$PAGES_ARTIFACT\") | .id")
            if [ -n "$artifact_id" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
